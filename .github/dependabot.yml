version: 2
updates:
  - package-ecosystem: bundler
    directory: /theme # the theme's Gemfile lives in theme/, not the repo root
    schedule:
      interval: daily
    allow:
      - dependency-type: direct
  - package-ecosystem: "github-actions"
    # / covers .github/workflows; /build is the engine's own composite action.
    directories: ["/", "/build"]
    schedule:
      interval: daily
      time: "10:00"
    open-pull-requests-limit: 10
