version: 2
updates:
  - package-ecosystem: bundler
    directory: /theme # the theme's Gemfile lives in theme/, not the repo root
    schedule:
      interval: daily
    allow:
      - dependency-type: direct
  - package-ecosystem: "github-actions"
    # / covers .github/workflows and the engine's own action.yml at the root.
    directory: "/"
    schedule:
      interval: daily
      time: "10:00"
    open-pull-requests-limit: 10
