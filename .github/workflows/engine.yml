# Builds the lite fixture with the engine (build/) as a consumer would, then
# checks the site, including the 3D mounts openscad-web adds, which a local
# build (build/test/build_local.sh) cannot.

name: Engine

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lite:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the lite fixture with the engine
        id: engine
        uses: ./build
        with:
          source-dir: build/test/fixtures/lite
          output-dir: _site-lite
          repository: CameronBrooks11/engine-fixture

      - name: Check what the fixture promises
        run: python3 build/test/expect_lite.py "${{ steps.engine.outputs.site-dir }}" "${{ steps.engine.outputs.summary }}"

      - name: Test the light/dark script
        run: node build/test/scheme_test.js

      - name: Keep the built site for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-lite-site
          path: _site-lite
          retention-days: 7

  model-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the model-only fixture with the engine
        id: engine
        uses: ./build
        with:
          source-dir: build/test/fixtures/model-only
          output-dir: _site-model-only
          repository: CameronBrooks11/engine-model-only

      - name: Check what the fixture promises
        run: python3 build/test/expect_model_only.py "${{ steps.engine.outputs.site-dir }}" "${{ steps.engine.outputs.summary }}"

  library:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the library fixture with the engine
        id: engine
        uses: ./build
        with:
          source-dir: build/test/fixtures/library
          output-dir: _site-library
          repository: CameronBrooks11/engine-library

      - name: Check what the fixture promises
        run: python3 build/test/expect_library.py "${{ steps.engine.outputs.site-dir }}" "${{ steps.engine.outputs.summary }}"

  scadman:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the scadman fixture with the engine
        id: engine
        uses: ./build
        with:
          source-dir: build/test/fixtures/scadman
          output-dir: _site-scadman
          repository: CameronBrooks11/engine-scadman

      - name: Check what the fixture promises
        run: python3 build/test/expect_library.py "${{ steps.engine.outputs.site-dir }}" "${{ steps.engine.outputs.summary }}"

  full:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the full fixture with the engine
        id: engine
        uses: ./build
        with:
          source-dir: build/test/fixtures/full
          output-dir: _site-full
          repository: CameronBrooks11/engine-full

      - name: Check what the fixture promises
        run: python3 build/test/expect_full.py "${{ steps.engine.outputs.site-dir }}" "${{ steps.engine.outputs.summary }}"

  opt-out:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the opt-out fixture with the engine
        id: engine
        uses: ./build
        with:
          source-dir: build/test/fixtures/opt-out
          output-dir: _site-opt-out
          repository: CameronBrooks11/engine-opt-out

      - name: Check what the fixture promises
        run: python3 build/test/expect_opt_out.py "${{ steps.engine.outputs.site-dir }}" "${{ steps.engine.outputs.summary }}"

  embed:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the embed fixture with the engine
        id: engine
        uses: ./build
        with:
          source-dir: build/test/fixtures/embed
          output-dir: _site-embed
          repository: CameronBrooks11/engine-embed

      - name: Check what the fixture promises
        run: python3 build/test/expect_embed.py "${{ steps.engine.outputs.site-dir }}" "${{ steps.engine.outputs.summary }}"

      - name: Refuse docs-site.yml values the engine does not know
        run: bash build/test/refuse_bad_values.sh build/assemble.py
